services:
  accounts-db:
    image: postgres:17
    container_name: accounts-db
    command: postgres -c max_prepared_transactions=100
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: quarkus
      POSTGRES_PASSWORD: quarkus
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U quarkus -d accounts" ]
      interval: 5s
      timeout: 5s
      retries: 10

  xfers-db:
    image: postgres:17
    container_name: xfer-db
    command: postgres -c max_prepared_transactions=100
    environment:
      POSTGRES_DB: xfers
      POSTGRES_USER: quarkus
      POSTGRES_PASSWORD: quarkus
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U quarkus -d xfers" ]
      interval: 5s
      timeout: 5s
      retries: 10


  account:
    image: nicolasduminil/account:1.0-SNAPSHOT
    container_name: accounts
    depends_on:
      accounts-db:
        condition: service_healthy
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_DATASOURCE_ACCOUNTS_JDBC_URL: jdbc:postgresql://accounts-db:5432/accounts
      QUARKUS_DATASOURCE_ACCOUNTS_USERNAME: quarkus
      QUARKUS_DATASOURCE_ACCOUNTS_PASSWORD: quarkus
    ports:
      - "8081:8081"

  transfer:
    image: nicolasduminil/transfer:1.0-SNAPSHOT
    container_name: xfers
    depends_on:
      accounts-db:
        condition: service_healthy
      xfers-db:
        condition: service_healthy
      account:
        condition: service_started
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_DATASOURCE_ACCOUNTS_JDBC_URL: jdbc:postgresql://accounts-db:5432/accounts
      QUARKUS_DATASOURCE_ACCOUNTS_USERNAME: quarkus
      QUARKUS_DATASOURCE_ACCOUNTS_PASSWORD: quarkus
      QUARKUS_DATASOURCE_XFERS_JDBC_URL: jdbc:postgresql://xfers-db:5432/xfers
      QUARKUS_DATASOURCE_XFERS_USERNAME: quarkus
      QUARKUS_DATASOURCE_XFERS_PASSWORD: quarkus
    ports:
      - "8080:8080"
