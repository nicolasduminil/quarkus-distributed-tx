quarkus.http.port=8080
quarkus.http.test-port=8083
quarkus.container-image.build=true
quarkus.container-image.group=nicolasduminil
quarkus.container-image.name=transfer
quarkus.swagger-ui.always-include=true

# Use the JPA/Panache repository (the in-memory one is the CDI @Default alternative).
quarkus.arc.selected-alternatives=fr.simplex_software.quarkus_xa.money_xfr.transfer.repository.TransferRepositoryXA,fr.simplex_software.quarkus_xa.money_xfr.account_repository.AccountRepositoryXA

# The transfer service is the XA coordinator: one JTA transaction enlists both
# the accounts and the xfers datasources, so Narayana runs a two-phase commit
# across the two PostgreSQL databases.
quarkus.transaction-manager.enable-recovery=true
quarkus.transaction-manager.object-store.directory=target/ObjectStore

# --- accounts XA datasource (debit/credit) ---
quarkus.datasource.accounts.db-kind=postgresql
quarkus.datasource.accounts.jdbc.transactions=xa
quarkus.datasource.accounts.devservices.command=postgres -c max_prepared_transactions=100
quarkus.hibernate-orm.accounts.datasource=accounts
quarkus.hibernate-orm.accounts.packages=fr.simplex_software.quarkus_xa.money_xfr.account_repository

# --- xfers XA datasource (transfer records) ---
quarkus.datasource.xfers.db-kind=postgresql
quarkus.datasource.xfers.jdbc.transactions=xa
quarkus.datasource.xfers.devservices.command=postgres -c max_prepared_transactions=100
quarkus.hibernate-orm.xfers.datasource=xfers
quarkus.hibernate-orm.xfers.packages=fr.simplex_software.quarkus_xa.money_xfr.transfer.domain,io.quarkus.hibernate.orm.panache
quarkus.hibernate-orm.xfers.database.generation=drop-and-create

# In dev/test the transfer service is self-contained: it owns the accounts
# schema and seeds it. In prod the account service owns the accounts schema.
quarkus.hibernate-orm.accounts.database.generation=drop-and-create
quarkus.hibernate-orm.accounts.sql-load-script=import-accounts.sql
%prod.quarkus.hibernate-orm.accounts.database.generation=none
%prod.quarkus.hibernate-orm.accounts.sql-load-script=no-file

%prod.quarkus.datasource.accounts.jdbc.url=jdbc:postgresql://localhost:5432/accounts
%prod.quarkus.datasource.accounts.username=quarkus
%prod.quarkus.datasource.accounts.password=quarkus
%prod.quarkus.datasource.xfers.jdbc.url=jdbc:postgresql://localhost:5433/xfers
%prod.quarkus.datasource.xfers.username=quarkus
%prod.quarkus.datasource.xfers.password=quarkus
