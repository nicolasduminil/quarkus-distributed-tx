quarkus.http.port=8090
quarkus.http.test-port=8093
quarkus.container-image.build=true
quarkus.container-image.group=nicolasduminil
quarkus.container-image.name=transfer-lra
quarkus.swagger-ui.always-include=true

# --- xfers datasource (transfer log only) ---
# Deliberately NOT an XA datasource. A saga has a single resource manager per
# participant; there is nothing to two-phase commit here, and no accounts
# datasource either - this service cannot reach the accounts database at all.
quarkus.datasource.xfers.db-kind=postgresql
quarkus.hibernate-orm.xfers.datasource=xfers
quarkus.hibernate-orm.xfers.packages=fr.simplex_software.quarkus_xa.money_xfr.transfer_lra.domain,io.quarkus.hibernate.orm.panache
quarkus.hibernate-orm.xfers.database.generation=drop-and-create

# --- Saga coordination (MicroProfile LRA) ---
# The coordinator is a separate process, unlike the JTA transaction manager which
# is embedded. In dev/test the Quarkus LRA Dev Service supplies one; it stays
# active only because quarkus.lra.coordinator-url is left undefined outside %prod.
quarkus.lra.devservices.shared=true
quarkus.lra.devservices.service-name=lra-coordinator
%prod.quarkus.lra.coordinator-url=http://localhost:50000/lra-coordinator

# The account service is the only way this service can touch a balance.
quarkus.rest-client.account-lra.url=http://localhost:8081

%prod.quarkus.datasource.xfers.jdbc.url=jdbc:postgresql://localhost:5434/xfers
%prod.quarkus.datasource.xfers.username=quarkus
%prod.quarkus.datasource.xfers.password=quarkus
