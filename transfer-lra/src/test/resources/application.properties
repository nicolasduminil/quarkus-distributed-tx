# Test-only wiring.
#
# The saga must talk to a real account participant over HTTP, so the account
# service's resources are co-deployed into the test application and the REST
# client is pointed back at this same port. The saga protocol is therefore
# exercised in full - real coordinator, real LRA context propagation over HTTP,
# two distinct participants, real @Complete/@Compensate callbacks. What this does
# not cover is a network partition between the two services; for that, run the
# genuinely distributed topology in docker-compose.yaml.
quarkus.rest-client.account-lra.url=http://localhost:8093

# The coordinator runs in a container and has to call the participants BACK for
# @Complete / @Compensate. Left to itself the participant advertises a localhost
# URL, which from inside the coordinator's container means the coordinator itself
# - so the callbacks silently go nowhere. quarkus.lra.base-uri overrides the
# address the participant publishes; 172.17.0.1 is the Docker bridge gateway,
# i.e. how a container addresses the host on Linux.
quarkus.http.host=0.0.0.0
quarkus.lra.base-uri=http://172.17.0.1:8093

# The account service's persistence, borrowed for the duration of the test.
quarkus.arc.selected-alternatives=fr.simplex_software.quarkus_xa.money_xfr.account_repository.AccountRepositoryXA
quarkus.datasource.accounts.db-kind=postgresql
quarkus.hibernate-orm.accounts.datasource=accounts
quarkus.hibernate-orm.accounts.packages=fr.simplex_software.quarkus_xa.money_xfr.account_repository,fr.simplex_software.quarkus_xa.money_xfr.account.lra
quarkus.hibernate-orm.accounts.database.generation=drop-and-create
quarkus.hibernate-orm.accounts.sql-load-script=import-accounts.sql
