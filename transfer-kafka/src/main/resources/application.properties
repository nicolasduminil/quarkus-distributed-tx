quarkus.http.port=8095
quarkus.http.test-port=8098
quarkus.container-image.build=true
quarkus.container-image.group=nicolasduminil
quarkus.container-image.name=transfer-kafka
quarkus.swagger-ui.always-include=true

quarkus.arc.selected-alternatives=fr.simplex_software.quarkus_xa.money_xfr.transfer_core.repository.TransferRepositoryXA,fr.simplex_software.quarkus_xa.money_xfr.account_repository.AccountRepositoryXA

quarkus.transaction-manager.enable-recovery=true
quarkus.transaction-manager.object-store.directory=target/ObjectStore

quarkus.datasource.accounts.db-kind=postgresql
quarkus.datasource.accounts.jdbc.transactions=xa
quarkus.datasource.accounts.devservices.command=postgres -c max_prepared_transactions=100
quarkus.hibernate-orm.accounts.datasource=accounts
quarkus.hibernate-orm.accounts.packages=fr.simplex_software.quarkus_xa.money_xfr.account_repository

quarkus.datasource.xfers.db-kind=postgresql
quarkus.datasource.xfers.jdbc.transactions=xa
quarkus.datasource.xfers.devservices.command=postgres -c max_prepared_transactions=100
quarkus.hibernate-orm.xfers.datasource=xfers
quarkus.hibernate-orm.xfers.packages=fr.simplex_software.quarkus_xa.money_xfr.transfer_core.domain,fr.simplex_software.quarkus_xa.money_xfr.transfer_kafka.domain,io.quarkus.hibernate.orm.panache
quarkus.hibernate-orm.xfers.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.xfers.database.generation=update

quarkus.hibernate-orm.accounts.database.generation=drop-and-create
quarkus.hibernate-orm.accounts.sql-load-script=import-accounts.sql
%prod.quarkus.hibernate-orm.accounts.database.generation=none
%prod.quarkus.hibernate-orm.accounts.sql-load-script=no-file

quarkus.kafka.devservices.provider=upstream-kafka-native

mp.messaging.incoming.transfer-requests.connector=smallrye-kafka
mp.messaging.incoming.transfer-requests.topic=transfer-requests
mp.messaging.incoming.transfer-requests.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.transfer-requests.commit-strategy=ignore
mp.messaging.incoming.transfer-requests.failure-strategy=ignore
mp.messaging.incoming.transfer-requests.auto.offset.reset=earliest

mp.messaging.outgoing.transfer-events.connector=smallrye-kafka
mp.messaging.outgoing.transfer-events.topic=transfer-events

mp.messaging.incoming.transfer-events-in.connector=smallrye-kafka
mp.messaging.incoming.transfer-events-in.topic=transfer-events
mp.messaging.incoming.transfer-events-in.isolation.level=read_committed
mp.messaging.incoming.transfer-events-in.auto.offset.reset=earliest
mp.messaging.incoming.transfer-events-in.group.id=transfer-kafka-observer

mp.messaging.outgoing.transfer-requests-out.connector=smallrye-kafka
mp.messaging.outgoing.transfer-requests-out.topic=transfer-requests
mp.messaging.outgoing.transfer-requests-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer

%prod.quarkus.datasource.accounts.jdbc.url=jdbc:postgresql://localhost:5432/accounts
%prod.quarkus.datasource.accounts.username=quarkus
%prod.quarkus.datasource.accounts.password=quarkus
%prod.quarkus.datasource.xfers.jdbc.url=jdbc:postgresql://localhost:5435/xfers
%prod.quarkus.datasource.xfers.username=quarkus
%prod.quarkus.datasource.xfers.password=quarkus
%prod.kafka.bootstrap.servers=kafka:9092
