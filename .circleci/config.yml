version: 2.1

jobs:
  build-and-test:
    # A machine executor is required: the integration tests use Testcontainers
    # (Quarkus Dev Services) to start two PostgreSQL databases, the LRA
    # coordinator and the account service container.
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - restore_cache:
          keys:
            - quarkus-distributed-tx-m2-{{ checksum "pom.xml" }}
            - quarkus-distributed-tx-m2-
      - run:
          name: Build and run the XA and LRA integration tests
          command: mvn -B verify
          no_output_timeout: 20m
      - save_cache:
          key: quarkus-distributed-tx-m2-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2

workflows:
  build:
    jobs:
      - build-and-test
